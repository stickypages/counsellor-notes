name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            builder_args: --mac
            artifact_name: installers-mac
          - os: windows-latest
            platform: windows
            builder_args: --win
            artifact_name: installers-windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app and installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run generate:icons && npm run build && npx electron-builder ${{ matrix.builder_args }} --publish never

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/*
          if-no-files-found: error
